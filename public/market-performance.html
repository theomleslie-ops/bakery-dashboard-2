<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sand: #F5F1E8;
            --brown-dark: #3C3227;
            --brown-light: #8B7355;
            --rust: #C85A37;
            --green: #6B9F7F;
            --bg: #FFFFFF;
            --bg-alt: #F9F7F3;
            --text: var(--brown-dark);
            --text-light: var(--brown-light);
            --border: #E8E4DC;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1A1814;
                --bg-alt: #2A251F;
                --text: #F5F1E8;
                --text-light: #B8A89C;
                --border: #3C3227;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .loading, .error, .empty {
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
            margin: 2rem 0;
        }

        .loading {
            background-color: rgba(107, 159, 127, 0.1);
            border: 1px solid var(--green);
            color: var(--green);
        }

        .error {
            background-color: rgba(214, 69, 69, 0.1);
            border: 1px solid #D64545;
            border-radius: 8px;
            color: #D64545;
        }

        .empty {
            background-color: rgba(139, 115, 85, 0.1);
            border: 1px solid var(--text-light);
            color: var(--text-light);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .timeframe-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        button {
            padding: 0.5rem 1rem;
            background-color: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            color: var(--text);
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: var(--border);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        select {
            padding: 0.5rem;
            background-color: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.9rem;
        }

        .chart-container {
            background-color: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text);
        }

        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const root = ReactDOM.createRoot(document.getElementById('root'));

        const MARKET_COLORS = ['#2a78d6', '#ff9500', '#8b5cf6', '#10b981', '#ef4444', '#f59e0b', '#06b6d4', '#ec4899', '#6366f1', '#14b8a6', '#f97316', '#a855f7', '#0ea5e9', '#d946ef', '#84cc16'];
        const FOCUS_MARKETS = ['506 Retail', 'State St', 'SMA FRI', 'LA Farmers THU', 'DALY CITY THU', 'MV SUN', 'Alum Rock Village (Sun)', 'INNER SUNSET SUN', 'DIVISADERO SUN', 'FM SF SUN'];
        const MARKET_TOP_N_OPTIONS = [5, 8, 10, 15, 20, 25];
        const marketColor = (idx) => MARKET_COLORS[idx % MARKET_COLORS.length];
        const colorOf = (name, markets) => {
            const idx = markets.findIndex(m => m.name === name);
            return marketColor(idx >= 0 ? idx : 0);
        };
        const INACTIVE_MARKETS = ['506 Bakery', 'Applied Mat-pop up', 'Bio Med SF Popup', 'BioMed Popup', 'BLG ON THE AVE POP UP', 'CAMBRIAN WED', 'Commons Popup', 'East Bay UV Popup', 'EMERYVILLE-SAT', 'Halloween Bazaar-Pop up', 'Hidden Villa Popup', 'Intuit Popup', 'INTUITIVE SURGICAL POP UP', 'IRVINE CO-POP UP', 'Irvine Silicon Valley Popup', 'JR Olympics POP UP', 'KAISER PL FRI', 'Keppler\'s Popup', 'Kitchen', 'Lincoln Property Popup', 'LOE POP UP', 'Los Altos Holiday Popup', 'Lumentum-Pop up', 'Lunar New Year Popup', 'Micron Popup', 'MP BM WED', 'MPAEF Schoolhouse Pop Up', 'MT HOUSE-SUN', 'Munchy Fest', 'MV THUR', 'N. CUPERTINO-TUES', 'Netflix Popup', 'Oyster Point PopUp', 'Pet a Palooza Pop Up', 'POP UP', 'PORTOLA ART-POP UP', 'PRC Pop Up', 'Princeton Plaza SAT', 'QUEENS PUMPKIN-POP UP', 'Rivian Holiday PopUp', 'Robin Hood Pop Up', 'Robinhood Popup', 'RWC Bakery', 'SA Edu Pop Up', 'SA THURS', 'SA Xmas Tree Popup', 'SANTA TERESA SAT', 'Saratoga Block Party', 'Saritoga 5K-pop up', 'Saritoga Woods Block Party', 'SKY MEMORIAL-Pop up', 'Springline Popup', 'Stanford Popup', 'SVINTL Popup', 'SVINTL Special Popup', 'Synopsys Pop up', 'Tips Purgatory', 'UTOPIA PRTY MGMT-POP UP', 'VISA HQ'];

        const fmtMoneyShort = (v) => {
            if (Math.abs(v) >= 1000) return `$${Math.round(v / 1000).toLocaleString()}k`;
            return `$${Math.round(v).toLocaleString()}`;
        };

        function MarketSelectMenu({ markets, selected, setSelected, colorOf, totalRevenue, open, setOpen }) {
            const [topN, setTopN] = useState(8);
            const [bottomN, setBottomN] = useState(null);
            const menuRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (menuRef.current && !menuRef.current.contains(e.target)) setOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [setOpen]);

            const toggle = (name) => {
                setSelected(prev => {
                    const next = new Set(prev);
                    if (next.has(name)) next.delete(name);
                    else next.add(name);
                    return next;
                });
            };

            return (
                <div ref={menuRef} style={{ position: 'relative', display: 'inline-block', zIndex: 100 }}>
                    <button onClick={() => setOpen(o => !o)}>Select Markets ({selected.size}) {open ? '▴' : '▾'}</button>
                    {open && (
                        <div style={{ position: 'absolute', top: '100%', right: 0, marginTop: '4px', maxHeight: '60vh', overflowY: 'auto', background: 'white', border: '1px solid #d4b5a0', borderRadius: '8px', boxShadow: '0 4px 16px rgba(0,0,0,0.15)', zIndex: 1000, padding: '10px', width: '380px', maxWidth: '90vw' }}>
                            <div style={{ display: 'flex', gap: '6px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '8px', paddingBottom: '8px', borderBottom: '1px solid #d4b5a0' }}>
                                <button onClick={() => { setSelected(new Set(markets.map(m => m.name))); }} style={{ padding: '6px 10px', fontSize: '12px' }}>Select All</button>
                                <button onClick={() => { setSelected(new Set()); }} style={{ padding: '6px 10px', fontSize: '12px' }}>Select None</button>
                                <label style={{ display: 'flex', alignItems: 'center', gap: '4px', fontSize: '13px', color: '#6b4423' }}>
                                    Top <select value={topN} onChange={(e) => { const n = parseInt(e.target.value, 10); setTopN(n); setBottomN(null); setSelected(new Set(markets.slice(0, n).map(m => m.name))); }} style={{ padding: '4px', fontSize: '12px', border: '1px solid #d4b5a0', borderRadius: '4px' }}>
                                        {MARKET_TOP_N_OPTIONS.map(n => <option key={n} value={n}>{n}</option>)}
                                    </select>
                                </label>
                                <label style={{ display: 'flex', alignItems: 'center', gap: '4px', fontSize: '13px', color: '#6b4423' }}>
                                    Bottom <select value={bottomN || ''} onChange={(e) => { const n = e.target.value ? parseInt(e.target.value, 10) : null; setBottomN(n); setTopN(8); if (n) setSelected(new Set(markets.slice(-n).map(m => m.name))); }} style={{ padding: '4px', fontSize: '12px', border: '1px solid #d4b5a0', borderRadius: '4px' }}>
                                        <option value="">None</option>
                                        {MARKET_TOP_N_OPTIONS.map(n => <option key={n} value={n}>{n}</option>)}
                                    </select>
                                </label>
                                <button onClick={() => { setTopN(8); setBottomN(null); setSelected(new Set(FOCUS_MARKETS.filter(f => markets.some(m => m.name === f)))); }} style={{ padding: '6px 10px', fontSize: '12px' }}>Focus</button>
                            </div>
                            {markets.map(m => (
                                <label key={m.name} style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '6px', cursor: 'pointer', fontSize: '13px', color: '#6b4423', borderRadius: '4px' }} onMouseEnter={(e) => e.target.closest('label').style.background = '#f5f1ed'} onMouseLeave={(e) => e.target.closest('label').style.background = 'transparent'}>
                                    <input type="checkbox" checked={selected.has(m.name)} onChange={() => toggle(m.name)} style={{ cursor: 'pointer' }} />
                                    <span style={{ width: '10px', height: '10px', borderRadius: '2px', background: colorOf(m.name, markets), flexShrink: 0 }}></span>
                                    <span style={{ flex: 1 }}>{m.name}</span>
                                    <span style={{ color: '#8b6c57', fontSize: '12px' }}>{fmtMoneyShort(totalRevenue(m))}</span>
                                </label>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function MarketLineChart({ weekStarts, series, colorOf }) {
            const chartHeight = 400;
            const plotLeft = 60, plotRight = 960, plotTop = 20, plotBottom = chartHeight + 20;
            const n = weekStarts.length || 1;
            const xPos = (i) => plotLeft + ((plotRight - plotLeft) * i) / Math.max(n - 1, 1);
            const maxVal = Math.max(1, ...series.flatMap(s => s.revenue));
            const chartMax = maxVal * 1.1;
            const getY = (val) => plotBottom - (val / chartMax) * (plotBottom - plotTop);
            const labelStride = Math.max(1, Math.ceil(n / 16));
            const fmtWeekLabel = (dateStr) => { const [y, m, d] = dateStr.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };

            return (
                <svg width="100%" height="500" viewBox="0 0 1000 500" style={{ overflow: 'visible' }}>
                    <line x1={plotLeft} y1={plotBottom} x2={plotRight} y2={plotBottom} stroke="var(--text)" strokeWidth="2" />
                    <line x1={plotLeft} y1={plotTop} x2={plotLeft} y2={plotBottom} stroke="var(--text)" strokeWidth="2" />
                    {[0, 1, 2, 3, 4, 5].map(i => {
                        const val = (i * chartMax) / 5;
                        const y = plotBottom - (i * (plotBottom - plotTop)) / 5;
                        return (
                            <g key={`grid${i}`}>
                                <line x1={plotLeft} y1={y} x2={plotRight} y2={y} stroke="var(--border)" strokeWidth="1" />
                                <text x={plotLeft - 10} y={y + 4} textAnchor="end" fontSize="11" fill="var(--text-light)">${(val / 1000).toFixed(0)}k</text>
                            </g>
                        );
                    })}
                    {weekStarts.map((ws, i) => (i % labelStride === 0) && (
                        <text key={`xlabel${i}`} x={xPos(i)} y={plotBottom + 20} textAnchor="middle" fontSize="11" fill="var(--text)" fontWeight="600">{fmtWeekLabel(ws)}</text>
                    ))}
                    {series.map(s => (
                        <polyline key={s.name} points={s.revenue.map((v, i) => `${xPos(i)},${getY(v)}`).join(' ')}
                            fill="none" stroke={colorOf(s.name)} strokeWidth="2" vectorEffect="non-scaling-stroke" />
                    ))}
                    {n <= 14 && series.map(s => s.revenue.map((v, i) => (
                        <circle key={`${s.name}-${i}`} cx={xPos(i)} cy={getY(v)} r="3" fill={colorOf(s.name)} />
                    )))}
                </svg>
            );
        }

        function MarketPerformance() {
            const [allWeekStarts, setAllWeekStarts] = useState([]);
            const [allMarkets, setAllMarkets] = useState([]);
            const [selected, setSelected] = useState(new Set(['506 Retail', 'State St']));
            const [status, setStatus] = useState('loading');
            const [error, setError] = useState('');
            const [windowWeeks, setWindowWeeks] = useState(26);
            const [offsetWeeks, setOffsetWeeks] = useState(0);
            const [menuOpen, setMenuOpen] = useState(false);

            const MARKET_TIMEFRAME_OPTIONS = [
                { weeks: 8, label: '8 weeks' },
                { weeks: 26, label: '6 months' },
                { weeks: 52, label: '1 year' },
                { weeks: 156, label: '3 years' },
                { weeks: 260, label: '5 years' },
            ];

            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 30 * 60 * 1000);
                return () => clearInterval(interval);
            }, []);

            const fetchData = async () => {
                try {
                    setStatus('loading');
                    const baseUrl = window.location.origin;
                    const response = await fetch(`${baseUrl}/api/market-performance?weeks=260&netSales=true`);
                    const result = await response.json();
                    if (result.error) { setError(result.message || result.error); setStatus('error'); return; }
                    let weekStarts = result.weekStarts || [];
                    let markets = result.markets || [];
                    markets = markets.filter(m => !INACTIVE_MARKETS.some(inactive => inactive.toLowerCase().trim() === m.name.toLowerCase().trim()));
                    setAllWeekStarts(weekStarts);
                    setAllMarkets(markets);
                    setSelected(new Set(markets.slice(0, 8).map(m => m.name)));
                    setStatus(markets.length > 0 ? 'ready' : 'empty');
                } catch (err) {
                    setError('Failed to load data: ' + err.message);
                    setStatus('error');
                }
            };

            const total = allWeekStarts.length;
            const maxOffset = Math.max(0, total - windowWeeks);
            const clampedOffset = Math.min(offsetWeeks, maxOffset);
            const end = total - clampedOffset;
            const start = Math.max(0, end - windowWeeks);
            const weekStarts = allWeekStarts.slice(start, end);
            const markets = allMarkets.map(m => ({ name: m.name, revenue: m.revenue.slice(start, end) }));

            const step = windowWeeks;
            const goOlder = () => setOffsetWeeks(o => Math.min(maxOffset, o + step));
            const goNewer = () => setOffsetWeeks(o => Math.max(0, o - step));
            const changeTimeframe = (weeks) => { setWindowWeeks(weeks); setOffsetWeeks(0); };

            const totalRevenue = (m) => m.revenue.reduce((s, v) => s + v, 0);
            const visibleSeries = markets.filter(m => selected.has(m.name));
            const rangeLabel = weekStarts.length ? (() => {
                const startStr = weekStarts[0];
                const lastWeekStart = weekStarts[weekStarts.length - 1];
                const [y, m, d] = lastWeekStart.split('-').map(Number);
                const lastWeekEnd = new Date(y, m - 1, d + 6).toISOString().slice(0, 10);
                return `${startStr} – ${lastWeekEnd}`;
            })() : '';

            return (
                <div className="container">
                    <header>
                        <h1>🏪 Market Performance</h1>
                        <p className="subtitle">Weekly net sales by location{rangeLabel ? ` · ${rangeLabel}` : ''}</p>
                    </header>
                    <div className="controls">
                        <div className="timeframe-controls">
                            <button onClick={goOlder} disabled={status !== 'ready' || clampedOffset >= maxOffset} title="Earlier">◀</button>
                            <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '13px', color: 'var(--text)' }}>
                                Show
                                <select value={windowWeeks} onChange={(e) => changeTimeframe(parseInt(e.target.value, 10))}>
                                    {MARKET_TIMEFRAME_OPTIONS.map(opt => <option key={opt.weeks} value={opt.weeks}>{opt.label}</option>)}
                                </select>
                            </label>
                            <button onClick={goNewer} disabled={status !== 'ready' || clampedOffset <= 0} title="Later">▶</button>
                        </div>
                        {status === 'ready' && (
                            <MarketSelectMenu markets={allMarkets} selected={selected} setSelected={setSelected} colorOf={(name) => colorOf(name, allMarkets)} totalRevenue={(m) => m.revenue.reduce((s, v) => s + v, 0)} open={menuOpen} setOpen={setMenuOpen} />
                        )}
                    </div>
                    {status === 'loading' && <div className="loading">Loading market sales data from Square…</div>}
                    {status === 'error' && <div className="error">{error}</div>}
                    {status === 'empty' && <div className="empty">No market sales data available.</div>}
                    {status === 'ready' && (
                        <div className="chart-container">
                            <div className="chart-title">Weekly Net Sales by Market ({selected.size} of {allMarkets.length} selected)</div>
                            {visibleSeries.length > 0 ? (
                                <div style={{ padding: '1rem', backgroundColor: 'var(--bg)', borderRadius: '6px' }}>
                                    {allMarkets.length > 0 && <MarketLineChart weekStarts={weekStarts} series={visibleSeries} colorOf={(name) => {
                                        const idx = allMarkets.findIndex(m => m.name === name);
                                        return MARKET_COLORS[idx >= 0 ? idx % MARKET_COLORS.length : 0];
                                    }} />}
                                </div>
                            ) : (
                                <div className="empty">Select at least one market to view data</div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        root.render(<MarketPerformance />);
    </script>
</body>
</html>
