    function CashBalanceDashboard() {
      const [allBalances, setAllBalances] = useState([]);
      const [currentCash, setCurrentCash] = useState(0);
      const [status, setStatus] = useState('loading');
      const [error, setError] = useState('');
      const [weeksRange, setWeeksRange] = useState(52);
      const [hoveredIndex, setHoveredIndex] = useState(null);

      useEffect(() => { fetchData(); }, []);

      const fetchData = async () => {
        try {
          setStatus('loading');
          const baseUrl = window.location.origin;
          const response = await fetch(`${baseUrl}/api/cash-balance`);
          const data = await response.json();
          if (data.success) {
            setCurrentCash(data.currentCash);
            setAllBalances(data.balances || []);
            setStatus('ready');
          } else {
            setError(data.message || 'Failed to load cash balance data');
            setStatus('error');
          }
        } catch (err) {
          setError('Failed to load data: ' + err.message);
          setStatus('error');
        }
      };

      if (status === 'loading') return <div className="loading">Loading cash balance data…</div>;
      if (status === 'error') return <div className="error">{error}</div>;

      // Filter balances based on selected time range
      const today = new Date();
      const cutoffDate = new Date(today.getFullYear(), today.getMonth() - Math.ceil(weeksRange / 4.33), today.getDate());
      const cutoffDateStr = cutoffDate.toISOString().split('T')[0];
      const balances = allBalances.filter(b => b.date >= cutoffDateStr);

      const chartHeight = 400;
      const minBalance = Math.min(...balances.map(b => b.balance), 0);
      const maxBalance = Math.max(...balances.map(b => b.balance), currentCash);
      const range = maxBalance - minBalance || 1;
      const padding = range * 0.1;
      const chartMin = minBalance - padding;
      const chartMax = maxBalance + padding;
      const chartRange = chartMax - chartMin;

      const getY = (balance) => chartHeight - ((balance - chartMin) / chartRange) * chartHeight;
      const centerLine = getY(0);

      return (
        <div className="container">
          <header>
            <h1>💰 Cash Balance</h1>
            <p className="subtitle">Running cash balance trend from QB</p>
          </header>
          <div className="controls">
            <div className="view-toggle">
              {[
                { weeks: 26, label: '6 Months' },
                { weeks: 52, label: '1 Year' },
                { weeks: 156, label: '3 Years' },
                { weeks: 260, label: '5 Years' },
              ].map(opt => (
                <button key={opt.weeks} className={weeksRange === opt.weeks ? 'active' : ''} onClick={() => setWeeksRange(opt.weeks)}>{opt.label}</button>
              ))}
            </div>
          </div>
          <div className="metrics">
            <div className="metric-card">
              <div className="metric-label">Current Cash Balance</div>
              <div className="metric-value">
                {currentCash >= 1000000 ? `$${(currentCash / 1000000).toFixed(1)}M` : `$${(currentCash / 1000).toFixed(1)}k`}
              </div>
            </div>
          </div>
          <div className="chart-container">
            <div className="chart-title">Daily Cash Balance</div>
            {balances.length > 0 ? (
              <div style={{ position: 'relative' }}>
                <svg width="100%" height="500" viewBox="0 0 1000 450" style={{ overflow: 'visible' }}>
                  {/* Grid lines */}
                  {[0, 0.25, 0.5, 0.75, 1].map((pct, i) => {
                    const val = chartMin + (chartRange * pct);
                    const y = getY(val);
                    const formatAxisLabel = (num) => {
                      const abs = Math.abs(num);
                      if (abs >= 1000000) {
                        return '$' + (num / 1000000).toFixed(1) + 'M';
                      } else if (abs >= 1000) {
                        return '$' + (num / 1000).toFixed(0) + 'k';
                      }
                      return '$' + num.toFixed(0);
                    };
                    return (
                      <g key={`grid${i}`}>
                        <line x1="60" y1={y} x2="950" y2={y} stroke="#e0e0e0" strokeWidth="1" strokeDasharray="4" />
                        <text x="50" y={y + 4} textAnchor="end" fontSize="12" fill="#666">{formatAxisLabel(val)}</text>
                      </g>
                    );
                  })}

                  {/* Zero line */}
                  <line x1="60" y1={centerLine} x2="950" y2={centerLine} stroke="#000" strokeWidth="3" strokeDasharray="4" />

                  {/* Axes */}
                  <line x1="60" y1="10" x2="60" y2={chartHeight + 20} stroke="#333" strokeWidth="2" />
                  <line x1="60" y1={chartHeight + 20} x2="950" y2={chartHeight + 20} stroke="#333" strokeWidth="2" />

                  {/* Bar chart */}
                  {balances.map((b, i) => {
                    const barWidth = Math.max(1, 890 / balances.length - 1);
                    const x = 60 + (i / balances.length) * 890;
                    const y = getY(b.balance);
                    const barHeight = Math.abs(y - centerLine);
                    const barY = b.balance >= 0 ? y : centerLine;
                    const color = b.balance >= 0 ? '#10b981' : '#ef4444';
                    return (
                      <rect
                        key={`bar${i}`}
                        x={x}
                        y={barY}
                        width={barWidth}
                        height={barHeight}
                        fill={color}
                        opacity="0.8"
                        style={{ cursor: 'pointer' }}
                        onMouseEnter={() => setHoveredIndex(i)}
                        onMouseLeave={() => setHoveredIndex(null)}
                      />
                    );
                  })}

                  {/* X-axis labels - dynamic spacing to prevent overlap */}
                  {(() => {
                    const labelStride = Math.max(1, Math.ceil(balances.length / 15));
                    return balances.map((b, i) => {
                      const shouldShow = (i % labelStride === 0) || (i === balances.length - 1);
                      if (shouldShow) {
                        const x = 60 + (i / (balances.length - 1)) * 890;
                        const [year, month, day] = b.date.split('-');
                        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                        const label = `${monthNames[parseInt(month) - 1]} '${year.slice(-2)}`;
                        return (
                          <text key={`label${i}`} x={x} y={chartHeight + 40} textAnchor="middle" fontSize="11" fill="#666">
                            {label}
                          </text>
                        );
                      }
                      return null;
                    });
                  })()}

                  {/* Hover tooltip */}
                  {hoveredIndex !== null && (() => {
                    const b = balances[hoveredIndex];
                    const x = 60 + (hoveredIndex / (balances.length - 1)) * 890;
                    const [year, month, day] = b.date.split('-');
                    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                    const monthName = monthNames[parseInt(month) - 1];
                    const tooltipWidth = 180;
                    const tooltipHeight = 80;
                    const tooltipX = x < 500 ? x + 12 : x - tooltipWidth - 12;
                    const tooltipY = 20;
                    return (
                      <g key="tooltip">
                        <line x1={x} y1="10" x2={x} y2={chartHeight + 20} stroke="#ddd" strokeWidth="1" strokeDasharray="3" />
                        <rect x={tooltipX} y={tooltipY} width={tooltipWidth} height={tooltipHeight} fill="#fff" stroke="#ccc" strokeWidth="1" rx="4" />
                        <text x={tooltipX + 10} y={tooltipY + 20} fontSize="12" fontWeight="700" fill="#333">{monthName} {parseInt(day)}, {year}</text>
                        <text x={tooltipX + 10} y={tooltipY + 42} fontSize="11" fill="#666">Balance:</text>
                        <text x={tooltipX + 10} y={tooltipY + 62} fontSize="13" fontWeight="600" fill={b.balance < 0 ? '#ef4444' : '#10b981'}>${b.balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</text>
                      </g>
                    );
                  })()}
                </svg>
              </div>
            ) : (
              <div className="empty">No cash balance data available</div>
            )}
          </div>
        </div>
      );
    }

    function GrossMarginsDashboard() {
      const [products, setProducts] = useState([]);
      const [sortBy, setSortBy] = useState('margin');
      const [sortDir, setSortDir] = useState('desc');

      useEffect(() => {
        const fetchData = async () => {
          try {
            const baseUrl = window.location.origin;
            const response = await fetch(`${baseUrl}/api/product-margins`);
            const data = await response.json();
            setProducts(data.products || []);
          } catch (err) {
            console.error('Failed to load product margins:', err);
          }
        };
        fetchData();
      }, []);

      const sorted = [...products].sort((a, b) => {
        const aVal = a[sortBy];
        const bVal = b[sortBy];
        const cmp = typeof aVal === 'number' ? aVal - bVal : String(aVal).localeCompare(String(bVal));
        return sortDir === 'asc' ? cmp : -cmp;
      });

      const toggle = (field) => {
        if (sortBy === field) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        else { setSortBy(field); setSortDir('desc'); }
      };

      const weightedMargin = products.length > 0 ? (() => {
        const totalRevenue = products.reduce((s, p) => s + (p.squarePrice * (p.quantity || 0)), 0);
        if (totalRevenue === 0) return 0;
        const totalMargin = products.reduce((s, p) => s + ((p.squarePrice - p.cogs) * (p.quantity || 0)), 0);
        return (totalMargin / totalRevenue * 100).toFixed(1);
      })() : 0;

      return (
        <div className="container">
          <header>
            <h1>📊 Gross Margins</h1>
            <p className="subtitle">Revenue, COGS, and gross margin % by product</p>
          </header>

          <div className="metrics">
            <div className="metric-card">
              <div className="metric-label">Products</div>
              <div className="metric-value">{products.length}</div>
              <div className="metric-sub">Total tracked</div>
            </div>
            <div className="metric-card">
              <div className="metric-label">Weighted Margin %</div>
              <div className="metric-value">{weightedMargin}%</div>
              <div className="metric-sub">{products.length > 0 ? `Based on quantities sold` : 'No products'}</div>
            </div>
          </div>

          {products.length > 0 && (
            <div className="panel" style={{ overflowX: 'auto' }}>
              <div className="panel-title">Product Margins</div>
              <table style={{ fontSize: '13px' }}>
                <thead>
                  <tr>
                    <th style={{ cursor: 'pointer', userSelect: 'none' }} onClick={() => toggle('name')}>Product {sortBy === 'name' && (sortDir === 'asc' ? '▲' : '▼')}</th>
                    <th className="num" style={{ cursor: 'pointer', userSelect: 'none' }} onClick={() => toggle('quantity')}>Volume {sortBy === 'quantity' && (sortDir === 'asc' ? '▲' : '▼')}</th>
                    <th className="num" style={{ cursor: 'pointer', userSelect: 'none' }} onClick={() => toggle('cogs')}>COGS {sortBy === 'cogs' && (sortDir === 'asc' ? '▲' : '▼')}</th>
                    <th className="num" style={{ cursor: 'pointer', userSelect: 'none' }} onClick={() => toggle('squarePrice')}>Price {sortBy === 'squarePrice' && (sortDir === 'asc' ? '▲' : '▼')}</th>
                    <th className="num" style={{ cursor: 'pointer', userSelect: 'none' }} onClick={() => toggle('margin')}>Margin % {sortBy === 'margin' && (sortDir === 'asc' ? '▲' : '▼')}</th>
                    <th className="num">Margin $</th>
                  </tr>
                </thead>
                <tbody>
                  {sorted.map(p => (
                    <tr key={p.name}>
                      <td>{p.name}</td>
                      <td className="num">{p.quantity ? Math.round(p.quantity).toLocaleString() : '—'}</td>
                      <td className="num">${p.cogs.toFixed(2)}</td>
                      <td className="num">${p.squarePrice.toFixed(2)}</td>
                      <td className="num" style={{ fontWeight: '600', color: p.margin >= 0.8 ? '#10b981' : p.margin >= 0.75 ? '#6b4423' : '#ff9500' }}>{(p.margin * 100).toFixed(1)}%</td>
                      <td className="num">${(p.squarePrice - p.cogs).toFixed(2)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    function MainApp() {
      const [activeTab, setActiveTab] = useState('dashboard');
      return (
        <div>
          <div style={{ background: '#f5f1ed', borderBottom: '2px solid #d4b5a0', paddingTop: '20px' }}>
            <div className="container">
              <div className="tabs">
                <button className={`tab-button ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>Financial Dashboard</button>
                <button className={`tab-button ${activeTab === 'overtime' ? 'active' : ''}`} onClick={() => setActiveTab('overtime')}>Overtime Report</button>
                <button className={`tab-button ${activeTab === 'prime-cost' ? 'active' : ''}`} onClick={() => setActiveTab('prime-cost')}>Prime Cost</button>
                <button className={`tab-button ${activeTab === 'gross-margins' ? 'active' : ''}`} onClick={() => setActiveTab('gross-margins')}>Gross Margins</button>
                <button className={`tab-button ${activeTab === 'market-performance' ? 'active' : ''}`} onClick={() => setActiveTab('market-performance')}>Performance by Location</button>
                <button className={`tab-button ${activeTab === 'cash-balance' ? 'active' : ''}`} onClick={() => setActiveTab('cash-balance')}>Cash Balance</button>
              </div>
            </div>
          </div>
          <div className={`tab-content ${activeTab === 'dashboard' ? 'active' : ''}`}><DashboardContent /></div>
          <div className={`tab-content ${activeTab === 'overtime' ? 'active' : ''}`}><OvertimeContent /></div>
          <div className={`tab-content ${activeTab === 'prime-cost' ? 'active' : ''}`}><PrimeCostDashboard /></div>
          <div className={`tab-content ${activeTab === 'gross-margins' ? 'active' : ''}`}><GrossMarginsDashboard /></div>
          <div className={`tab-content ${activeTab === 'market-performance' ? 'active' : ''}`}><MarketPerformanceDashboard /></div>
          <div className={`tab-content ${activeTab === 'cash-balance' ? 'active' : ''}`}><CashBalanceDashboard /></div>
        </div>
      );
    }
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
      return <MainApp />;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
